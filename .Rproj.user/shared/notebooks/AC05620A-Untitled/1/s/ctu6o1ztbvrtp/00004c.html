cietal collapse because of computers not being able to recognize the date changing: Y2K panic.<\/span>","<span style='color:darkslateblue;'><b>[2001]<\/b><br>The Twin Towers are bombed, prompting the United States' War on Terror.<\/span>","<span style='color:darkslateblue;'><b>[2004]<\/b><br>Indian Ocean Tsunami.<\/span>","<span style='color:darkslateblue;'><b>[2004]<\/b><br>Hurricane Katrina.<\/span>","<span style='color:darkslateblue;'><b>[2007]<\/b><br>The first iPhone is released.<\/span>","<span style='color:darkslateblue;'><b>[2008]<\/b><br>The most severe global financial crisis since the Great Depression.<\/span>","<span style='color:darkslateblue;'><b>[2010 FLASH CRASH]<\/b><br>Futures trader Navinder Singh Sarao creates a massive automated sell order triggers a chain reaction among high-frequency trading algorithms causing the Dow Jones to plummet 1,000 points in minutes.<\/span>","<span style='color:darkslateblue;'><b>[2011]<\/b><br>Egyptian President Hosni Mubarak is ousted after protests in Tunisia and Egypt.<\/span>","<span style='color:darkslateblue;'><b>[2011]<\/b><br>9.0 magnitude earthquake hits Japan, causing the Fukushima Daiichi nuclear crisis.<\/span>","<span style='color:darkslateblue;'><b>[2011]<\/b><br>Civil Wars break out in Libya and Syria.<\/span>","<span style='color:darkslateblue;'><b>[2011]<\/b><br>Occupy Wall Street movement.<\/span>","<span style='color:darkslateblue;'><b>[2012 THRESHOLD]<\/b><br>Mayan Long Count calendar ends, Timewave Zero hits absolute zero and the novelty is unbearable, linear chronology is terminated.<\/span>","<span style='color:darkslateblue;'><b>[2012 ALEXNET AI BREAKTHROUGH]<\/b><br>Starting point of the deep-learning revolution. The Board unleashing its ultimate control weapon to eliminate novelty.<\/span>","<span style='color:darkslateblue;'><b>[2014]<\/b><br>Amazon Echo and Alexa are launched.<\/span>","<span style='color:darkslateblue;'><b>[2015]<\/b><br>OpenAI is founded.<\/span>","<span style='color:da
